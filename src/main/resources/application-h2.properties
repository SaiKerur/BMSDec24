spring.application.name=BMSDec24

# Run without MySQL: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Demo catalog/booking data is seeded on startup by H2DataSeeder.
spring.datasource.url=jdbc:h2:mem:bms;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never

# Optional: access H2 console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Run this profile on port 8087 instead of 8080
server.port=8087

bms.security.jwt.secret=ZmFrZS1iYXNlNjQtc2VjcmV0LWZvci1ibXMtZGV2LW9ubHktcGxlYXNlLW92ZXJyaWRlLWluLXByb2Q=
bms.security.jwt.access-token-validity-minutes=15
bms.security.jwt.refresh-token-validity-days=7
bms.security.jwt.issuer=bmsdec24

bms.booking.hold-expiry-scheduler-enabled=true
bms.booking.hold-expiry-interval-ms=120000
